[project]
name = "will-it-land"
version = "0.1.0"
description = "Checks every cultural reference in a script against the audience it is for, grounded in Qloo."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "httpx>=0.27",
  "anthropic>=2.1,<3",
  "google-genai>=1.0",
  "mcp>=2.3,<3",
  "pydantic>=2.7",
]

[tool.uv]
dev-dependencies = ["pytest>=8", "modal>=1.0"]
