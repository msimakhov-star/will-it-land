<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
body{margin:0;width:1200px;height:630px;background:#f7f4ee;color:#17150f;font-family:Inter,sans-serif;display:flex;flex-direction:column;justify-content:center;padding:0 80px;box-sizing:border-box}
h1{font-family:Fraunces,serif;font-size:96px;margin:0;letter-spacing:-2px}
.land{text-decoration:underline wavy #b02f22;text-decoration-thickness:5px;text-underline-offset:14px}
p{font-size:34px;margin:28px 0 40px;font-weight:500}
.rooms{display:flex;gap:28px}
.room{flex:1;background:#fff;border-radius:22px;padding:26px 30px;box-shadow:0 1px 0 rgba(23,21,15,.05),0 12px 30px -16px rgba(23,21,15,.25);border:1px solid rgba(23,21,15,.1)}
.lab{font-size:20px;color:#625d53;text-transform:uppercase;letter-spacing:1px}
.line{font-size:30px;margin-top:12px}
.m{text-underline-offset:6px;text-decoration-thickness:3px}
.miss{text-decoration:underline wavy #b02f22;background:rgba(176,47,34,.12)}
.ok{text-decoration:underline solid #1a6b43}
sup{font-size:18px;font-weight:700;margin-left:3px}
.r{color:#b02f22}.g{color:#1a6b43}
.stamp{position:absolute;top:44px;right:60px;font-size:18px;padding:6px 14px;border-radius:999px;border:1px solid rgba(23,21,15,.25);background:repeating-linear-gradient(135deg,rgba(23,21,15,.07) 0 4px,transparent 4px 8px),#fff}
</style></head><body>
<div class="stamp">Demo data, live Qloo data pending</div>
<h1>Will It <span class="land">Land</span></h1>
<p>Same joke, two rooms, opposite result.</p>
<div class="rooms">
<div class="room"><div class="lab">Under 25s in London</div><div class="line">a <span class="m miss">Blockbuster</span><sup class="r">18</sup> card she never returned</div></div>
<div class="room"><div class="lab">55+ in St. Louis</div><div class="line">a <span class="m ok">Blockbuster</span><sup class="g">92</sup> card she never returned</div></div>
</div>
</body></html>
